services:
  shared_postgres:
    container_name: codely-java_ddd_example-postgres
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: mooc
      POSTGRES_HOST_AUTH_METHOD: trust
    entrypoint:
      sh -c "
        echo 'CREATE DATABASE backoffice;' > /docker-entrypoint-initdb.d/init.sql;
        /usr/local/bin/docker-entrypoint.sh postgres
      "

  shared_kafka:
    container_name: codely-java_ddd_example-kafka
    image: confluentinc/cp-kafka:8.3.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: codely-kafka-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@shared_kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://shared_kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  backoffice_backend_server_java:
    container_name: codely-java_ddd_example-backoffice_backend_server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8040:8040"
    volumes:
      - .:/app:delegated
      - backoffice_backend_gradle_cache:/app/.gradle
    depends_on:
      - shared_postgres
    command: ["./gradlew", "bootRun", "--args", "backoffice_backend server"]

  backoffice_frontend_server_java:
    container_name: codely-java_ddd_example-backoffice_frontend_server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8041:8041"
    volumes:
      - .:/app:delegated
      - backoffice_frontend_gradle_cache:/app/.gradle
    depends_on:
      - shared_postgres
    command: ["./gradlew", "bootRun", "--args", "backoffice_frontend server"]

  mooc_backend_server_java:
    container_name: codely-java_ddd_example-mooc_backend_server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8030:8030"
    volumes:
      - .:/app:delegated
      - mooc_backend_gradle_cache:/app/.gradle
    depends_on:
      - shared_postgres
    command: ["./gradlew", "bootRun", "--args", "mooc_backend server"]

  test_server_java:
    container_name: codely-java_ddd_example-test_server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app:delegated
      - test_gradle_cache:/app/.gradle
    depends_on:
      - shared_postgres
    tty: true

volumes:
  backoffice_backend_gradle_cache:
  backoffice_frontend_gradle_cache:
  mooc_backend_gradle_cache:
  test_gradle_cache:
